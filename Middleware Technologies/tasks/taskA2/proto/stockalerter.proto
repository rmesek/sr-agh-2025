syntax = "proto3";

import "google/protobuf/timestamp.proto";

package stockalerter;

option java_multiple_files = true;
option java_package = "gen";
option java_outer_classname = "StockAlerterProto";

service StockAlerter {
  rpc Subscribe(SubscriptionRequest) returns (stream NotificationMessage) {}
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse) {}
}

// Represents an amount of money with its currency type.
// Source: https://github.com/googleapis/googleapis/blob/master/google/type/money.proto
message Money {
  // The three-letter currency code defined in ISO 4217.
  string currency_code = 1;

  // The whole units of the amount.
  // For example if `currencyCode` is `"USD"`, then 1 unit is one US dollar.
  int64 units = 2;

  // Number of nano (10^-9) units of the amount.
  // The value must be between -999,999,999 and +999,999,999 inclusive.
  // If `units` is positive, `nanos` must be positive or zero.
  // If `units` is zero, `nanos` can be positive, zero, or negative.
  // If `units` is negative, `nanos` must be negative or zero.
  // For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
  int32 nanos = 3;
}

enum AlertType {
  ALERT_TYPE_UNSPECIFIED = 0;
  PRICE_ABOVE_THRESHOLD = 1;
  PRICE_BELOW_THRESHOLD = 2;
  GENERAL_UPDATE = 3;
}

message SubscriptionRequest {
  string subscription_id = 1;
  string stock_symbol = 2;
  optional Money notify_above_price = 3;
  optional Money notify_below_price = 4;
}

message NotificationMessage {
  string stock_symbol = 1;
  optional Money current_price = 2;
  AlertType alert_type = 3;
  string alert_message = 4;
  repeated string related_symbols = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message UnsubscribeRequest {
  string subscription_id = 1;
}

message UnsubscribeResponse {
  string confirmation_message = 1;
}